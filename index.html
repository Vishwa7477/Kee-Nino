<!doctype html>
<html lang="en" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- ===================================================
         SEO / Primary Meta
         =================================================== -->
  <title>Vasanth &amp; Keerthana | Wedding Invitation</title>
  <meta name="description"
    content="Join us as Vasanth &amp; Keerthana begin their beautiful new chapter on 17 September 2026." />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0D315A" />
  <meta name="color-scheme" content="light" />

  <!-- ===================================================
         Open Graph — for WhatsApp / social sharing
         =================================================== -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Vasanth &amp; Keerthana | Wedding Invitation" />
  <meta property="og:description"
    content="Join us as Vasanth &amp; Keerthana begin their beautiful new chapter on 17 September 2026." />
  <meta property="og:image" content="/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Vasanth & Keerthana Wedding Invitation — 17 September 2026" />
  <meta property="og:url" content="https://kee-nino.vercel.app" />
  <meta property="og:locale" content="en_IN" />
  <meta property="og:site_name" content="Vasanth &amp; Keerthana" />

  <!-- ===================================================
         Twitter / X Card
         =================================================== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Vasanth &amp; Keerthana | Wedding Invitation" />
  <meta name="twitter:description"
    content="Join us as Vasanth &amp; Keerthana begin their beautiful new chapter on 17 September 2026." />
  <meta name="twitter:image" content="/og-image.jpg" />

  <!-- ===================================================
         WhatsApp-specific (uses og: tags above)
         No additional tags needed — og:image + og:title
         are already picked up by WhatsApp's link preview.
         =================================================== -->

  <!-- ===================================================
         Favicon
         Replace /favicon.svg with an actual icon when ready.
         =================================================== -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- ===================================================
         Preconnect for Google Fonts — performance
         =================================================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- ===================================================
         Structured Data — JSON-LD Event
         =================================================== -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Event",
      "name": "Vasanth & Keerthana Wedding",
      "startDate": "2026-09-17T10:30:00+05:30",
      "endDate": "2026-09-17T11:30:00+05:30",
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      "location": {
        "@type": "Place",
        "name": "Vassan Mahal",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Musiri",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        }
      },
      "description": "The wedding ceremony of Vasanth and Keerthana.",
      "organizer": {
        "@type": "Person",
        "name": "Vishwa"
      }
    }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
